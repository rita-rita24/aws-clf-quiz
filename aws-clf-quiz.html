<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS CLF 4択トレーニング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&amp;display=block" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --line-strong: #b9c2cf;
      --aws: #ff9900;
      --aws-dark: #232f3e;
      --blue: #2563eb;
      --green: #15803d;
      --green-soft: #e9f8ee;
      --red: #b42318;
      --red-soft: #fff0ed;
      --yellow-soft: #fff6df;
      --focus: #111827;
      --shadow: 0 10px 22px rgba(22, 34, 51, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
      font-size: 15px;
    }

    body {
      --auto-font-scale: 1;
      margin: 0;
      height: 100dvh;
      min-height: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: calc(1rem * var(--auto-font-scale));
      line-height: 1.55;
      letter-spacing: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    body.fit-tight {
      --auto-font-scale: 0.92;
    }

    body.fit-ultra {
      --auto-font-scale: 0.84;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.38);
      outline-offset: 2px;
    }

    .material-symbols-outlined {
      display: inline-block;
      font-family: "Material Symbols Outlined";
      font-size: 1.22em;
      font-style: normal;
      font-weight: normal;
      line-height: 1;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-variation-settings:
        "FILL" 0,
        "wght" 600,
        "GRAD" 0,
        "opsz" 24;
      pointer-events: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 760px;
      min-width: 280px;
      height: 100dvh;
      margin: 0 auto;
      padding: 10px;
      overflow: hidden;
    }

    .topbar {
      flex: 0 0 auto;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 2px 8px;
      border-bottom: 2px solid var(--aws);
      background: var(--bg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      background: var(--aws-dark);
      color: white;
      font-size: 0.77rem;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: inset 0 -4px 0 var(--aws);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      color: var(--aws-dark);
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-pill {
      display: grid;
      gap: 0;
      min-width: 82px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 4px 12px rgba(22, 34, 51, 0.08);
      text-align: right;
    }

    .score-label {
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.1;
    }

    .score-value {
      color: var(--aws-dark);
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .progress-wrap {
      grid-column: 1 / -1;
      height: 7px;
      background: #e5eaf1;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--aws), #22a06b);
      transition: width 160ms ease;
    }

    .toolbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin: 6px 0 10px;
    }

    .select,
    .tool-btn {
      min-height: 36px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }

    .select {
      width: 100%;
      min-width: 0;
      padding: 0 30px 0 10px;
    }

    .tool-btn {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      padding: 0 10px;
      font-weight: 700;
    }

    .tool-btn .material-symbols-outlined,
    .nav-btn .material-symbols-outlined {
      font-size: 1.28rem;
    }

    .tool-btn:hover {
      border-color: var(--line-strong);
      background: #fbfcfe;
    }

    .tool-btn.active {
      border-color: rgba(255, 153, 0, 0.8);
      background: var(--yellow-soft);
      color: #7a4a00;
    }

    .quiz {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .meta {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .counter {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .question-area {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      padding: 14px 12px 12px;
      overflow: hidden;
    }

    .question {
      flex: 0 0 auto;
      min-height: 0;
      margin: 0;
      color: var(--text);
      font-size: 1.06rem;
      font-weight: 800;
      line-height: 1.52;
    }

    .options {
      flex: 1 1 auto;
      display: grid;
      gap: 8px;
      margin-top: 12px;
      min-height: 0;
      align-content: start;
    }

    .option {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 8px 10px 8px 8px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      text-align: left;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .option:hover {
      border-color: var(--line-strong);
      background: #fbfcfe;
    }

    .option:active {
      transform: translateY(1px);
    }

    .option-key {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      background: #edf1f6;
      color: var(--aws-dark);
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1;
    }

    .option-text {
      font-weight: 700;
      line-height: 1.45;
    }

    .option.correct {
      border-color: rgba(21, 128, 61, 0.55);
      background: var(--green-soft);
    }

    .option.correct .option-key {
      background: var(--green);
      color: #ffffff;
    }

    .option.incorrect {
      border-color: rgba(180, 35, 24, 0.45);
      background: var(--red-soft);
    }

    .option.incorrect .option-key {
      background: var(--red);
      color: #ffffff;
    }

    .explain {
      flex: 0 0 auto;
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-left: 4px solid var(--blue);
      background: #eff6ff;
      color: #16335f;
      font-size: 0.91rem;
      font-weight: 650;
    }

    .explain.visible {
      display: block;
    }

    .nav {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .nav-btn,
    .primary-btn {
      min-height: 38px;
      font-weight: 800;
    }

    .nav-btn {
      min-width: 42px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--aws-dark);
    }

    .nav-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .primary-btn {
      width: 100%;
      padding: 0 12px;
      background: var(--aws-dark);
      color: #ffffff;
    }

    .summary-head .tool-btn {
      min-width: 36px;
      padding: 0 8px;
    }

    .primary-btn:hover,
    .nav-btn:hover:not(:disabled) {
      filter: brightness(1.04);
    }

    .summary {
      flex: 0 0 auto;
      display: none;
      margin-top: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }

    .summary.visible {
      display: block;
    }

    .summary-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .summary-title {
      margin: 0;
      color: var(--aws-dark);
      font-size: 0.95rem;
      font-weight: 900;
    }

    .summary-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }

    .domain-stat {
      min-width: 0;
      padding: 10px;
      border-right: 1px solid var(--line);
    }

    .domain-stat:last-child {
      border-right: 0;
    }

    .domain-name {
      min-height: 2.8em;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .domain-score {
      color: var(--aws-dark);
      font-size: 1.05rem;
      font-weight: 900;
    }

    .empty {
      display: none;
      margin: 12px 0 0;
      padding: 12px;
      border: 1px dashed var(--line-strong);
      background: #ffffff;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }

    .empty.visible {
      display: block;
    }

    .source {
      flex: 0 0 auto;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .source a {
      color: #1d4ed8;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    body.fit-tight .app {
      padding: 6px;
    }

    body.fit-tight .topbar {
      gap: 5px;
      padding: 5px 1px 4px;
    }

    body.fit-tight .logo {
      width: 28px;
      height: 28px;
      font-size: 0.66rem;
      box-shadow: inset 0 -3px 0 var(--aws);
    }

    body.fit-tight h1 {
      font-size: 0.92rem;
    }

    body.fit-tight .subtitle {
      display: none;
    }

    body.fit-tight .score-pill {
      min-width: 64px;
      padding: 3px 6px;
    }

    body.fit-tight .score-label {
      font-size: 0.64rem;
    }

    body.fit-tight .score-value {
      font-size: 0.98rem;
      line-height: 1.1;
    }

    body.fit-tight .progress-wrap {
      height: 5px;
    }

    body.fit-tight .toolbar {
      gap: 5px;
      margin: 4px 0 5px;
    }

    body.fit-tight .select,
    body.fit-tight .tool-btn {
      min-height: 30px;
    }

    body.fit-tight .tool-btn {
      min-width: 32px;
      padding: 0 7px;
    }

    body.fit-tight .meta {
      gap: 5px;
      padding: 5px 8px;
    }

    body.fit-tight .chip-row {
      gap: 4px;
    }

    body.fit-tight .chip {
      min-height: 20px;
      padding: 1px 6px;
      font-size: 0.68rem;
    }

    body.fit-tight .counter {
      font-size: 0.69rem;
    }

    body.fit-tight .question-area {
      padding: 7px 8px 6px;
    }

    body.fit-tight .question {
      font-size: 0.92rem;
      line-height: 1.34;
    }

    body.fit-tight .options {
      gap: 5px;
      margin-top: 7px;
    }

    body.fit-tight .option {
      grid-template-columns: 25px 1fr;
      gap: 6px;
      min-height: 34px;
      padding: 4px 6px;
    }

    body.fit-tight .option-key {
      width: 23px;
      height: 23px;
      font-size: 0.75rem;
    }

    body.fit-tight .option-text {
      line-height: 1.3;
    }

    body.fit-tight .explain {
      margin-top: 6px;
      padding: 6px;
      border-left-width: 3px;
      font-size: 0.78rem;
      line-height: 1.34;
      max-height: 3.35em;
      overflow: hidden;
    }

    body.fit-tight .nav {
      gap: 6px;
      padding: 6px 8px;
    }

    body.fit-tight .nav-btn,
    body.fit-tight .primary-btn {
      min-height: 31px;
    }

    body.fit-tight .nav-btn {
      min-width: 34px;
    }

    body.fit-tight .summary,
    body.fit-tight .source,
    body.fit-ultra .summary,
    body.fit-ultra .source {
      display: none !important;
    }

    body.fit-ultra .app {
      padding: 4px;
    }

    body.fit-ultra .topbar {
      padding: 2px 0;
    }

    body.fit-ultra .logo {
      width: 22px;
      height: 22px;
      font-size: 0.58rem;
    }

    body.fit-ultra h1 {
      font-size: 0.84rem;
    }

    body.fit-ultra .score-pill {
      min-width: 54px;
      padding: 2px 5px;
    }

    body.fit-ultra .score-label {
      display: none;
    }

    body.fit-ultra .score-value {
      font-size: 0.9rem;
    }

    body.fit-ultra .progress-wrap {
      height: 4px;
    }

    body.fit-ultra .toolbar {
      gap: 4px;
      margin: 3px 0 4px;
    }

    body.fit-ultra .select,
    body.fit-ultra .tool-btn {
      min-height: 27px;
    }

    body.fit-ultra .tool-btn {
      min-width: 29px;
    }

    body.fit-ultra .meta {
      padding: 3px 6px;
    }

    body.fit-ultra #levelChip {
      display: none;
    }

    body.fit-ultra .question-area {
      padding: 5px 6px;
    }

    body.fit-ultra .question {
      display: -webkit-box;
      overflow: hidden;
      font-size: 0.86rem;
      line-height: 1.28;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
    }

    body.fit-ultra .options {
      gap: 3px;
      margin-top: 5px;
    }

    body.fit-ultra .option {
      grid-template-columns: 22px 1fr;
      min-height: 29px;
      padding: 3px 5px;
    }

    body.fit-ultra .option-key {
      width: 20px;
      height: 20px;
      font-size: 0.68rem;
    }

    body.fit-ultra .option-text {
      line-height: 1.22;
    }

    body.fit-ultra .explain {
      margin-top: 4px;
      padding: 4px 5px;
      font-size: 0.7rem;
      line-height: 1.24;
      max-height: 2.65em;
    }

    body.fit-ultra .nav {
      gap: 5px;
      padding: 2px 6px;
    }

    body.fit-ultra .nav-btn,
    body.fit-ultra .primary-btn {
      min-height: 26px;
    }

    body.fit-ultra .nav-btn {
      min-width: 28px;
    }

    @media (max-width: 520px) {
      .app {
        padding: 7px;
      }

      .topbar {
        grid-template-columns: 1fr auto;
        gap: 6px;
        padding-top: 7px;
      }

      .logo {
        width: 30px;
        height: 30px;
        font-size: 0.7rem;
      }

      h1 {
        font-size: 0.96rem;
      }

      .subtitle,
      .source {
        font-size: 0.7rem;
      }

      .score-pill {
        min-width: 74px;
        padding: 5px 7px;
      }

      .toolbar {
        grid-template-columns: 1fr repeat(2, 36px);
      }

      .tool-btn {
        min-width: 36px;
        padding: 0;
      }

      .meta,
      .question-area,
      .nav {
        padding-left: 9px;
        padding-right: 9px;
      }

      .question {
        min-height: 0;
        font-size: 1rem;
      }

      .option {
        grid-template-columns: 28px 1fr;
        gap: 7px;
        min-height: 44px;
        padding: 7px 8px 7px 7px;
      }

      .option-key {
        width: 26px;
        height: 26px;
      }

      .summary-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .domain-stat {
        border-bottom: 1px solid var(--line);
      }

      .domain-stat:nth-child(even) {
        border-right: 0;
      }

      .domain-stat:nth-last-child(-n + 2) {
        border-bottom: 0;
      }
    }

    @media (max-width: 340px) {
      .brand {
        gap: 6px;
      }

      .subtitle {
        display: none;
      }

      .toolbar {
        grid-template-columns: 1fr repeat(2, 34px);
      }

      .chip {
        font-size: 0.7rem;
        padding: 2px 6px;
      }

      .question {
        min-height: 0;
      }

      .nav {
        gap: 6px;
      }
    }

    .logo,
    .score-pill,
    .progress-wrap,
    .select,
    .tool-btn,
    .quiz,
    .chip,
    .option,
    .option-key,
    .explain,
    .nav-btn,
    .primary-btn,
    .summary,
    .empty {
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">AWS</div>
        <div>
          <h1>AWS CLF 4択トレーニング</h1>
          <div class="subtitle">CLF-C02重要サービス 60問</div>
        </div>
      </div>
      <div class="score-pill" aria-live="polite">
        <span class="score-label">正答</span>
        <span class="score-value" id="scoreValue">0/0</span>
      </div>
      <div class="progress-wrap" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </header>

    <section class="toolbar" aria-label="学習設定">
      <select class="select" id="domainSelect" aria-label="出題カテゴリ">
        <option value="all">全カテゴリ</option>
      </select>
      <button class="tool-btn" id="shuffleBtn" type="button" title="並び替え" aria-label="並び替え">
        <span class="material-symbols-outlined" aria-hidden="true">shuffle</span>
      </button>
      <button class="tool-btn" id="wrongBtn" type="button" title="間違い復習" aria-label="間違い復習">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </section>

    <section class="quiz" id="quizPanel" aria-live="polite">
      <div class="meta">
        <div class="chip-row">
          <span class="chip" id="domainChip">カテゴリ</span>
          <span class="chip" id="levelChip">基礎</span>
        </div>
        <div class="counter" id="counter">0 / 60</div>
      </div>

      <div class="question-area">
        <p class="question" id="questionText"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explain"></div>
      </div>

      <nav class="nav" aria-label="問題移動">
        <button class="nav-btn" id="prevBtn" type="button" title="前の問題" aria-label="前の問題">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
        </button>
        <button class="primary-btn" id="nextBtn" type="button">次の未回答へ</button>
        <button class="nav-btn" id="nextArrowBtn" type="button" title="次の問題" aria-label="次の問題">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>
      </nav>
    </section>

    <p class="empty" id="emptyState">対象の問題がありません。</p>

    <section class="summary" id="summary">
      <div class="summary-head">
        <h2 class="summary-title">カテゴリ別</h2>
        <button class="tool-btn" id="resetBtn" type="button" title="リセット" aria-label="リセット">
          <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
        </button>
      </div>
      <div class="summary-list" id="summaryList"></div>
    </section>

    <p class="source">
      参考: <a href="https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html" target="_blank" rel="noreferrer">AWS Certified Cloud Practitioner (CLF-C02) Exam Guide</a> /
      <a href="https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html" target="_blank" rel="noreferrer">In-Scope AWS Services</a>
    </p>

      {

      },
      {
        domain: "請求・料金・サポート",
        level: "基礎",
        q: "AWSやサードパーティーのソフトウェア、データ、サービスを検索・購入できる場所はどれですか。",
        choices: ["AWS Marketplace", "AWS Organizations", "Amazon VPC", "AWS CloudFormation"],
        a: 0,
        exp: "AWS MarketplaceではAWS上で利用できるソフトウェアやサービスを調達できます。"
      },
      {
        domain: "請求・料金・サポート",
        level: "標準",
        q: "請求やアカウントに関する基本的な問い合わせを含め、AWS利用者が全員利用できるサポートプランはどれですか。",
        choices: ["Basic Support", "Developer Support", "Business Support", "Enterprise Support"],
        a: 0,
        exp: "Basic SupportはすべてのAWSアカウントで利用できます。技術サポートの範囲は有料プランで広がります。"
      }
    ];

    const state = {
      current: 0,
      filter: "all",
      wrongOnly: false,
      order: QUESTIONS.map((_, index) => index),
      choiceOrders: buildChoiceOrders(),
      answers: Array(QUESTIONS.length).fill(null)
    };

    const els = {
      body: document.body,
      app: document.querySelector(".app"),
      scoreValue: document.getElementById("scoreValue"),
      progressBar: document.getElementById("progressBar"),
      domainSelect: document.getElementById("domainSelect"),
      shuffleBtn: document.getElementById("shuffleBtn"),
      wrongBtn: document.getElementById("wrongBtn"),
      quizPanel: document.getElementById("quizPanel"),
      domainChip: document.getElementById("domainChip"),
      levelChip: document.getElementById("levelChip"),
      counter: document.getElementById("counter"),
      questionText: document.getElementById("questionText"),
      options: document.getElementById("options"),
      explain: document.getElementById("explain"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      nextArrowBtn: document.getElementById("nextArrowBtn"),
      emptyState: document.getElementById("emptyState"),
      summary: document.getElementById("summary"),
      summaryList: document.getElementById("summaryList"),
      resetBtn: document.getElementById("resetBtn")
    };

    function init() {
      DOMAINS.forEach((domain) => {
        const option = document.createElement("option");
        option.value = domain;
        option.textContent = domain;
        els.domainSelect.appendChild(option);
      });

      restore();
      bindEvents();
      render();
    }

    function bindEvents() {
      els.domainSelect.addEventListener("change", () => {
        state.filter = els.domainSelect.value;
        state.current = 0;
        save();
        render();
      });

      els.shuffleBtn.addEventListener("click", () => {
        shuffleOrder();
        state.current = 0;
        save();
        render();
      });

      els.wrongBtn.addEventListener("click", () => {
        state.wrongOnly = !state.wrongOnly;
        state.current = 0;
        save();
        render();
      });

      els.prevBtn.addEventListener("click", () => move(-1));
      els.nextArrowBtn.addEventListener("click", () => move(1));
      els.nextBtn.addEventListener("click", jumpNextUnanswered);
      els.resetBtn.addEventListener("click", resetAnswers);
      window.addEventListener("resize", adjustFit);

      document.addEventListener("keydown", (event) => {
        if (event.target && ["SELECT", "BUTTON"].includes(event.target.tagName)) return;
        if (event.key >= "1" && event.key <= "4") choose(Number(event.key) - 1);
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
      });
    }

    function visibleIndices() {
      return state.order.filter((index) => {
        const question = QUESTIONS[index];
        const domainMatch = state.filter === "all" || question.domain === state.filter;
        const wrongMatch = !state.wrongOnly || (state.answers[index] !== null && state.answers[index] !== question.a);
        return domainMatch && wrongMatch;
      });
    }

    function render() {
      const visible = visibleIndices();
      const hasQuestions = visible.length > 0;

      els.quizPanel.style.display = hasQuestions ? "block" : "none";
      els.emptyState.classList.toggle("visible", !hasQuestions);
      els.wrongBtn.classList.toggle("active", state.wrongOnly);
      els.domainSelect.value = state.filter;

      renderScore();
      renderSummary();

      if (!hasQuestions) return;

      if (state.current >= visible.length) state.current = visible.length - 1;
      if (state.current < 0) state.current = 0;

      const questionIndex = visible[state.current];
      const question = QUESTIONS[questionIndex];
      const selected = state.answers[questionIndex];

      els.domainChip.textContent = question.domain;
      els.levelChip.textContent = question.level;
      els.counter.textContent = `${state.current + 1} / ${visible.length}`;
      els.questionText.textContent = question.q;
      els.explain.textContent = question.exp;
      els.explain.classList.toggle("visible", selected !== null);
      els.options.innerHTML = "";

      const choiceOrder = state.choiceOrders[questionIndex] || makeChoiceOrder(question, questionIndex);

      choiceOrder.forEach((originalChoiceIndex, choiceIndex) => {
        const choice = question.choices[originalChoiceIndex];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.setAttribute("aria-label", `${choiceIndex + 1}. ${choice}`);

        if (selected !== null) {
          if (originalChoiceIndex === question.a) button.classList.add("correct");
          if (originalChoiceIndex === selected && selected !== question.a) button.classList.add("incorrect");
        }

        const key = document.createElement("span");
        key.className = "option-key";
        key.textContent = String.fromCharCode(65 + choiceIndex);

        const text = document.createElement("span");
        text.className = "option-text";
        text.textContent = choice;

        button.append(key, text);
        button.addEventListener("click", () => choose(choiceIndex));
        els.options.appendChild(button);
      });

      els.prevBtn.disabled = state.current === 0;
      els.nextArrowBtn.disabled = state.current === visible.length - 1;
      updatePrimaryLabel(visible);
      adjustFit();
    }

    function choose(choiceIndex) {
      const visible = visibleIndices();
      if (!visible.length) return;

      const questionIndex = visible[state.current];
      const question = QUESTIONS[questionIndex];
      const choiceOrder = state.choiceOrders[questionIndex] || makeChoiceOrder(question, questionIndex);
      state.answers[questionIndex] = choiceOrder[choiceIndex];
      save();
      render();
    }

    function move(delta) {
      const visible = visibleIndices();
      if (!visible.length) return;

      state.current = Math.min(Math.max(state.current + delta, 0), visible.length - 1);
      save();
      render();
    }

    function jumpNextUnanswered() {
      const visible = visibleIndices();
      if (!visible.length) return;

      const next = visible.findIndex((questionIndex, index) => index > state.current && state.answers[questionIndex] === null);
      if (next !== -1) {
        state.current = next;
        save();
        render();
        return;
      }

      const first = visible.findIndex((questionIndex) => state.answers[questionIndex] === null);
      if (first !== -1) {
        state.current = first;
        save();
        render();
        return;
      }

      if (state.current < visible.length - 1) {
        state.current += 1;
        save();
        render();
      }
    }

    function updatePrimaryLabel(visible) {
      const unanswered = visible.some((questionIndex) => state.answers[questionIndex] === null);
      if (unanswered) {
        els.nextBtn.textContent = "次の未回答へ";
      } else if (state.current < visible.length - 1) {
        els.nextBtn.textContent = "次の問題へ";
      } else {
        els.nextBtn.textContent = "完了";
      }
    }

    function renderScore() {
      const answered = state.answers.filter((answer) => answer !== null).length;
      const correct = state.answers.reduce((sum, answer, index) => {
        return sum + (answer === QUESTIONS[index].a ? 1 : 0);
      }, 0);

      els.scoreValue.textContent = `${correct}/${answered}`;
      els.progressBar.style.width = `${Math.round((answered / QUESTIONS.length) * 100)}%`;
    }

    function renderSummary() {
      const answered = state.answers.filter((answer) => answer !== null).length;
      els.summary.classList.toggle("visible", answered > 0);
      els.summaryList.innerHTML = "";

      DOMAINS.forEach((domain) => {
        const indices = QUESTIONS
          .map((question, index) => ({ question, index }))
          .filter((item) => item.question.domain === domain);
        const answeredInDomain = indices.filter((item) => state.answers[item.index] !== null).length;
        const correctInDomain = indices.filter((item) => state.answers[item.index] === item.question.a).length;

        const stat = document.createElement("div");
        stat.className = "domain-stat";
        stat.innerHTML = `
          <div class="domain-name">${domain}</div>
          <div class="domain-score">${correctInDomain}/${answeredInDomain}</div>
        `;
        els.summaryList.appendChild(stat);
      });
    }

    function resetAnswers() {
      state.answers = Array(QUESTIONS.length).fill(null);
      state.current = 0;
      state.wrongOnly = false;
      save();
      render();
    }

    function shuffleOrder() {
      const order = QUESTIONS.map((_, index) => index);
      for (let i = order.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      state.order = order;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        current: state.current,
        filter: state.filter,
        wrongOnly: state.wrongOnly,
        order: state.order,
        choiceOrders: state.choiceOrders,
        answers: state.answers
      }));
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return;

        if (Array.isArray(saved.answers) && saved.answers.length === QUESTIONS.length) {
          state.answers = saved.answers;
        }
        if (Array.isArray(saved.order) && saved.order.length === QUESTIONS.length) {
          state.order = saved.order;
        }
        if (Array.isArray(saved.choiceOrders) && saved.choiceOrders.length === QUESTIONS.length && saved.choiceOrders.every(isValidChoiceOrder)) {
          state.choiceOrders = saved.choiceOrders;
        }
        if (DOMAINS.includes(saved.filter) || saved.filter === "all") {
          state.filter = saved.filter;
        }
        state.wrongOnly = Boolean(saved.wrongOnly);
        state.current = Number.isInteger(saved.current) ? saved.current : 0;
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function buildChoiceOrders() {
      return QUESTIONS.map((question, index) => makeChoiceOrder(question, index));
    }

    function makeChoiceOrder(question, questionIndex) {
      const correctSlot = questionIndex % 4;
      const distractors = [0, 1, 2, 3].filter((index) => index !== question.a);
      shuffleArray(distractors);

      const order = [];
      let distractorIndex = 0;
      for (let slot = 0; slot < 4; slot += 1) {
        order[slot] = slot === correctSlot ? question.a : distractors[distractorIndex++];
      }
      return order;
    }

    function isValidChoiceOrder(order) {
      return Array.isArray(order) &&
        order.length === 4 &&
        new Set(order).size === 4 &&
        order.every((index) => Number.isInteger(index) && index >= 0 && index <= 3);
    }

    function shuffleArray(items) {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function adjustFit() {
      els.body.classList.remove("fit-tight", "fit-ultra");

      const width = window.innerWidth;
      const height = window.innerHeight;
      if (height <= 610 || width <= 420) {
        els.body.classList.add("fit-tight");
      }
      if (height <= 480 || width <= 330) {
        els.body.classList.remove("fit-tight");
        els.body.classList.add("fit-ultra");
      }

      requestAnimationFrame(() => {
        const overflows = els.app.scrollHeight > els.app.clientHeight + 1 ||
          document.documentElement.scrollHeight > window.innerHeight + 1;

        if (overflows && !els.body.classList.contains("fit-ultra")) {
          els.body.classList.remove("fit-tight");
          els.body.classList.add("fit-ultra");
        }
      });
    }

    init();
  </script>
